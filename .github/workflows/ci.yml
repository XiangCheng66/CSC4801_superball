name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Django and matching tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: superball_ci
          POSTGRES_USER: superball_ci
          # Disposable CI-only credentials; never used by the application.
          POSTGRES_PASSWORD: local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U superball_ci -d superball_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_ENGINE: postgresql
      TEST_DATABASE_ENGINE: postgresql
      POSTGRES_DB: superball_ci
      POSTGRES_USER: superball_ci
      POSTGRES_PASSWORD: local-ci-only
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_SETTINGS_MODULE: config.test_settings
      PYTHONPATH: backend
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and Django configuration
        run: |
          python -m pip check
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run all unit tests and report unfinished modules
        run: python -m pytest tests/unit -v -ra

  frontend:
    name: React tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend unit tests
        run: npm test
      - name: Build React application
        run: npm run build
